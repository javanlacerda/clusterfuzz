steps:
  # Step 1: Deploy to Staging Environment
  # This step runs automatically.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-to-staging'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo "🚀 Deploying to Staging..."
    # Add your staging deployment commands here

  # Step 2: CORRECTED Manual Approval Step
  # This step only has an 'id' and 'waitFor'.
  # This is the correct way to make the pipeline pause.
- 
- name: 'gcr.io/cloud-builders/gcloud' # <-- This name is required
  id: 'wait-for-approval'
  waitFor: ['deploy-to-staging', '-']

  # Step 3: Deploy to Production Environment
  # This step only runs after the 'wait-for-approval' step is manually approved.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-to-production'
  waitFor: ['wait-for-approval']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo "✅ Approval received! Deploying to Production..."
    # Add your production deployment commands here


options:
  logging: CLOUD_LOGGING_ONLY # 